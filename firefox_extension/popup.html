<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      width: 300px;
      padding: 20px;
      background: #ffffff;
      color: #1a1a1a;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .icon-badge {
      width: 32px; height: 32px;
      background: #1a1a1a;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .icon-badge svg { width: 18px; height: 18px; fill: white; }

    h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1.2;
    }
    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
      padding-left: 42px;
    }

    .divider {
      border: none;
      border-top: 1px solid #ebebeb;
      margin-bottom: 16px;
    }

    #recipe-name {
      font-size: 12px;
      color: #444;
      background: #f6f6f6;
      border-radius: 5px;
      padding: 8px 10px;
      margin-bottom: 14px;
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #recipe-name.found { color: #1a1a1a; }
    #recipe-name.not-found { color: #aaa; font-style: italic; }

    button {
      width: 100%;
      padding: 11px 16px;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    button:hover:not(:disabled) { background: #2e2e2e; }
    button:disabled { background: #c8c8c8; cursor: default; }

    #apple-note-btn {
      margin-top: 8px;
      background: #ffffff;
      color: #1a1a1a;
      border: 1.5px solid #d0d0d0;
    }
    #apple-note-btn:hover:not(:disabled) { background: #f5f5f5; }
    #apple-note-btn:disabled { background: #f5f5f5; color: #aaa; border-color: #e0e0e0; cursor: default; }

    #status {
      font-size: 12px;
      color: #666;
      margin-top: 11px;
      min-height: 18px;
      text-align: center;
    }
    #status.error   { color: #c0392b; }
    #status.success { color: #27ae60; }

    .server-hint {
      display: none;
      margin-top: 12px;
      padding: 10px 11px;
      background: #fff8f0;
      border: 1px solid #f0d9be;
      border-radius: 6px;
      font-size: 11.5px;
      color: #7a5c30;
      line-height: 1.5;
    }
    .server-hint.visible { display: block; }
    .server-hint code {
      display: inline-block;
      margin-top: 4px;
      padding: 3px 7px;
      background: #f3e5d0;
      border-radius: 4px;
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 11px;
    }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .spinner.active { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon-badge">
      <!-- plate of food icon -->
      <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" fill="none">
        <!-- plate rim (outer ellipse) -->
        <ellipse cx="10" cy="12" rx="7.5" ry="5" stroke="white" stroke-width="1.2"/>
        <!-- plate inner highlight -->
        <ellipse cx="10" cy="12" rx="5.5" ry="3.3" stroke="white" stroke-width="0.7" opacity="0.45"/>
        <!-- fork on the left -->
        <line x1="3.5" y1="3" x2="3.5" y2="8.5" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
        <line x1="2.5" y1="3" x2="2.5" y2="6"   stroke="white" stroke-width="0.9" stroke-linecap="round"/>
        <line x1="4.5" y1="3" x2="4.5" y2="6"   stroke="white" stroke-width="0.9" stroke-linecap="round"/>
        <!-- knife on the right -->
        <line x1="16.5" y1="3" x2="16.5" y2="9" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
        <path d="M16.5 3 Q18 4.5 16.5 6.5" stroke="white" stroke-width="0.9" fill="none" stroke-linecap="round"/>
        <!-- steam lines above plate -->
        <path d="M8 7.5 Q8.5 6 8 4.5"  stroke="white" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.7"/>
        <path d="M10 7 Q10.5 5.5 10 4" stroke="white" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.7"/>
        <path d="M12 7.5 Q12.5 6 12 4.5" stroke="white" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.7"/>
      </svg>
    </div>
    <h1>Recipe → Metric PDF</h1>
  </div>
  <p class="subtitle">Converts US measurements to metric weight</p>
  <hr class="divider">

  <div id="recipe-name" class="not-found">
    <span id="recipe-label">Detecting recipe…</span>
  </div>

  <button id="convert" disabled>
    <div class="spinner" id="spinner"></div>
    <span id="btn-label">Convert to PDF</span>
  </button>

  <button id="apple-note-btn" disabled>
    <div class="spinner" id="note-spinner"></div>
    <span id="note-btn-label">
      <!-- Apple Notes icon -->
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <rect width="20" height="20" rx="4" fill="#FFD60A"/>
        <rect x="4" y="8" width="12" height="1.5" rx="0.75" fill="#1a1a1a"/>
        <rect x="4" y="11" width="9" height="1.5" rx="0.75" fill="#1a1a1a"/>
        <rect x="4" y="5" width="12" height="1.5" rx="0.75" fill="#1a1a1a"/>
      </svg>
      Save as Apple Note
    </span>
  </button>

  <div id="status"></div>
  <div id="hint" class="server-hint">
    Start the local server first:<br>
    <code>python server.py</code>
  </div>

  <script src="popup.js"></script>
</body>
</html>
